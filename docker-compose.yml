services:
  cms-db:
    image: postgres:16-alpine
    container_name: stroy-landing-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - cms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: stroy-landing-cms
    restart: unless-stopped
    depends_on:
      cms-db:
        condition: service_healthy
    env_file:
      - ./cms/.env
    command: ["npm", "run", "develop"]
    ports:
      - '1337:1337'
    volumes:
      - cms_uploads:/opt/app/public/uploads

volumes:
  cms_db_data:
  cms_uploads:
